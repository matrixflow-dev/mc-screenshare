name: Build

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed only to attach the jars to the release.
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Fabric Loom 1.19 and Minecraft 26.3 need Java 25.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      # The jar names come from the versions in the build files, so a release
      # tagged v0.2.0 must not ship screenshare-*-0.1.0.jar.
      - name: Check release tag matches versions
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          fabric=$(sed -n 's/^version=//p' fabric/gradle.properties)
          paper=$(sed -n "s/^version = '\(.*\)'/\1/p" paper/build.gradle)
          echo "tag=$TAG fabric=$fabric paper=$paper"
          if [ "${TAG#v}" != "$fabric" ] || [ "${TAG#v}" != "$paper" ]; then
            echo "::error::Tag $TAG does not match fabric ($fabric) / paper ($paper) versions"
            exit 1
          fi

      - name: Build Fabric mod
        working-directory: fabric
        run: ./gradlew build

      - name: Build Paper plugin
        working-directory: paper
        run: ./gradlew build

      - uses: actions/upload-artifact@v5
        with:
          name: jars
          path: |
            fabric/build/libs/screenshare-fabric-*.jar
            !fabric/build/libs/*-sources.jar
            paper/build/libs/screenshare-paper-*.jar

      - name: Attach jars to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" --clobber \
            $(ls fabric/build/libs/screenshare-fabric-*.jar | grep -v -- -sources.jar) \
            paper/build/libs/screenshare-paper-*.jar
